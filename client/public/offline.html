<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b2a5b" />
    <title>QS Nexus is offline</title>
    <style>
      :root { color: #10233f; background: #f5f8fc; font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif; }
      body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; box-sizing: border-box; text-align: center; }
      main { max-width: 360px; }
      img { width: 84px; height: 84px; border-radius: 20px; margin-bottom: 20px; }
      h1 { margin: 0 0 12px; font-size: 1.8rem; }
      p { margin: 0; color: #52627a; line-height: 1.6; }
    </style>
  </head>
  <body>
    <main>
      <img src="/qs-nexus-logo.svg" alt="QS Nexus" />
      <h1>You are offline</h1>
      <p>QS Nexus needs an internet connection for account data and academic resources. Reconnect and try again.</p>
    </main>
  </body>
</html>
